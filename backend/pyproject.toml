[project]
name = "pdf-to-md"
version = "0.1.0"
description = "Converte PDF em Markdown"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.148.0",
    "fastapi[standard]>=0.162.0",
    "pydantic-settings>=2.16.2",
    "pymupdf4llm>=2.1",
    "python-multipart>=0.0.33",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_to_md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: testes lentos (ex.: Docling)"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
